appId: com.sumorw.notedesk
productName: Sumora
directories:
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack: []
# node-pty 为 N-API 预编译（prebuilds/ 跨 Node/Electron ABI 通用），
# 无需 @electron/rebuild 重编译；本机也没有 node-gyp 构建链
npmRebuild: false
compression: maximum
win:
  target:
    - nsis
    - portable
  fileAssociations:
    - ext: html
      name: HTML 笔记
      description: HTML 笔记文件
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Sumora
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
